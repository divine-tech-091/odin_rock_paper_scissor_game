<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rock Paper Scissors</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div id="display_container">
			<div class="displayContainer">
				<p id="displayText" class="display">
					Computer score :
					<span class="computerScore">0</span>
				</p>
				<p id="displays" class="displayTxt">
					Human score :
					<span class="humanScore">0</span>
				</p>
			</div>
			<div class="declareTxt" id="declare"></div>
			<div id="btn_containers">
				<button id="rock" class="button">Rock</button>
				<button id="paper" class="button">Paper</button>
				<button id="scissors" class="button">Scissors</button>
			</div>
		</div>

		<script src="index.js"></script>
	</body>
</html>
